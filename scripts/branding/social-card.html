<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CRISPRloci sharing artwork</title>
    <style>
      @font-face {
        font-family: "IBM Plex Sans";
        font-weight: 400;
        src: url("../../src/assets/fonts/IBMPlexSans-Regular.woff2");
      }
      @font-face {
        font-family: "IBM Plex Sans";
        font-weight: 500;
        src: url("../../src/assets/fonts/IBMPlexSans-Medium.woff2");
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 80px;
        gap: 38px;
        color: #fff;
        background: #292b2f;
        font-family: "IBM Plex Sans", sans-serif;
      }
      img {
        width: 208px;
        height: 208px;
        flex: 0 0 auto;
      }
      h1 {
        margin: 0 0 20px;
        font-size: 88px;
        font-weight: 500;
        letter-spacing: -3px;
        line-height: 1.1;
      }
      h1 small {
        margin-left: 14px;
        color: #e0abbc;
        font-size: 34px;
        font-weight: 400;
        letter-spacing: 0;
      }
      p {
        margin: 0;
        color: #e0e3e6;
        font-size: 32px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <img
      src="../../public/favicon.svg"
      alt=""
    />
    <div>
      <h1>CRISPRloci<small>v2</small></h1>
      <p>CRISPR arrays, Cas systems<br />and evolutionary histories.</p>
    </div>
  </body>
</html>
